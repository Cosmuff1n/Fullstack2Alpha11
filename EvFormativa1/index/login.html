<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="body">

    <main class="container py-4 text-center">
        <h1 class="logintitle">Iniciar sesión</h1><br><br>

        <form id="loginForm">
            <label>E-mail:</label>
            <input type="email" id="email" placeholder="Correo electrónico" required><br><br>
            <label>Contraseña:</label>
            <input type="password" id="password" placeholder="Contraseña" required><br><br>
            <button type="submit" onclick="validarFormulario()">Iniciar sesión</button>
        </form>

        <p id="mensaje"></p>
        <a href="index.html">
            Volver a la tienda
        </a>

        <script src="assets/functions.js"></script>
</body>

</html>
