<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="assets/style.css">
</head>

<body class="body">

    <main class="container py-4 text-center">
        <h1 class="titulo-sitio">Calculadora</h1>

        <input type="radio" id="suma" name="operacion" value="suma">
        <label for="suma">Suma</label><br>

        <input type="radio" id="resta" name="operacion" value="resta">
        <label for="resta">Resta</label><br>

        <input type="radio" id="mult" name="operacion" value="mult">
        <label for="mult">Multiplicación</label><br>

        <input type="radio" id="div" name="operacion" value="div">
        <label for="div">División</label><br><br>

        <label for="username">Username:</label>
        <input type="text" id="username" name="username"><br><br>
        <label for="pwd">Password:</label>
        <input type="password" id="pwd" name="pwd"><br><br>
        <button type="button" onclick="operacion()">Calcular</button>
        <br><br>

        <output id="result"></output>


        <section class="mt-4">
            <img src="assets/cat-in-tux.png" class="img-fluid imagen-sitio" alt="Gato con traje">
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="ejemplo.js"></script>
</body>

</html>
