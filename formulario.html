<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>

</head>

<body>
    <main>
        <form id="formContacto">
            <label>Nombre:</label>
            <input type="text" id="nombre" placeholder="Tu nombre">

            <label>Correo:</label>
            <input type="email" id="correo" placeholder="Tu correo">

            <label>Pedido:</label>
            <textarea id="mensaje" placeholder="¿Qué quieres comprar?"></textarea>

            <!-- Este botón llama a la función validarFormulario() que creamos -->
            <button type="button" onclick="validarFormulario()">Enviar Pedido</button>
        </form>

    </main>
    <script src="funciones.js"></script>

</body>

</html>
