<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiendita - Inicio</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header>
        <div class="contenedor">
            <h1>Tiendita</h1>
            <p>Tu tienda de cosas</p>
            <nav>
                <a href="index.html">Inicio</a>
                <a href="productos.html">Productos</a>
                <a href="contacto.html">Contacto</a>
            </nav>
        </div>
    </header>

    <main class="contenedor">
        <section class="panel-formulario">
            <h2>Mensaje</h2>

            <form id="formContacto" novalidate>
                <div class="campo">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" autocomplete="name">
                    <small id="errorNombre" class="error"></small>
                </div>

                <div class="campo">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" autocomplete="email">
                    <small id="errorEmail" class="error"></small>
                </div>

                <div class="campo">
                    <label for="nombre">Mensaje</label>
                    <input type="text" id="mensaje" name="mensaje" autocomplete="mensaje">
                    <small id="errorMensaje" class="error"></small>
                </div>

                <button type="submit">Enviar</button>
                <p id="mensajeEnvio" class="mensaje-exito"></p>
            </form>
        </section>
    </main>



    <script src="js/contacto.js"></script>
</body>

</html>
