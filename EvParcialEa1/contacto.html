<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetStore - Contacto</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header>
        <div class="contenedor">
            <div>
                <h1>Pawsitive Eco 🐾</h1>
                <p>Tu tienda de productos ecológicos para mascotas</p>
            </div>
            <nav aria-label="Navegación principal">
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="productos.html">Productos</a></li>
                    <li><a href="contacto.html" class="active">Contacto</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="contenedor">
        <section class="panel-formulario">
            <h2>Mensaje</h2>

            <form id="formContacto" novalidate>
                <div class="campo">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" autocomplete="name">
                    <small id="errorNombre" class="error"></small>
                </div>

                <div class="campo">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" autocomplete="email">
                    <small id="errorEmail" class="error"></small>
                </div>

                <div class="campo">
                    <label for="mensaje">Mensaje</label>
                    <input type="text" id="mensaje" name="mensaje" autocomplete="off">
                    <small id="errorMensaje" class="error"></small>
                </div>

                <button type="submit">Enviar</button>

                <p id="mensajeEnvio" class="mensaje-exito"></p>
            </form>
        </section>
    </main>

    <script src="js/contacto.js"></script>
</body>

</html>
